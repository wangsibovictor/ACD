name: RankQ summary-aware SIFT1M experiment

on:
  push:
    branches:
      - agent/sift1m-quotient-run-20260807
  workflow_dispatch:

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OMP_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            numpy==1.26.4 pandas==2.2.2 h5py==3.11.0 faiss-cpu==1.8.0.post1
          python -m py_compile experiments/sift1m_1pct_experiment.py

      - name: Download SIFT1M
        run: |
          mkdir -p data
          curl -L --fail --retry 5 --retry-delay 5 \
            https://ann-benchmarks.com/sift-128-euclidean.hdf5 \
            -o data/sift-128-euclidean.hdf5

      - name: Run summary-aware suite
        run: |
          mkdir -p results
          /usr/bin/time -v python experiments/sift1m_1pct_experiment.py \
            --dataset data/sift-128-euclidean.hdf5 \
            --out results/rankq_summary \
            --queries 30 --threads 4 --M 8 --ef-construction 80 \
            --selectivity 0.01 \
            --efs 32,64,128,256 \
            2>&1 | tee results/rankq_summary_run.log

      - name: Commit compact results
        if: success()
        run: |
          mkdir -p experiment_outputs/rankq_summary
          cp results/rankq_summary/summary.csv experiment_outputs/rankq_summary/
          cp results/rankq_summary/structural.csv experiment_outputs/rankq_summary/
          cp results/rankq_summary/materialization.csv experiment_outputs/rankq_summary/
          cp results/rankq_summary/index_levels.csv experiment_outputs/rankq_summary/
          cp results/rankq_summary/hnsw_levels.csv experiment_outputs/rankq_summary/
          cp results/rankq_summary/selectivity_estimator.csv experiment_outputs/rankq_summary/
          cp results/rankq_summary/metadata.json experiment_outputs/rankq_summary/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiment_outputs/rankq_summary
          git commit -m "Add RankQ summary-aware SIFT1M results [skip ci]"
          git push

      - name: Upload full results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rankq-summary-sift1m-results
          path: results/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
