name: Analyze RankQ v3 SIFT1M results

on:
  push:
    branches:
      - agent/sift1m-quotient-run-20260807
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rankq-v3-analysis
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/rankq-v3-progress-20260823

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install numpy==1.26.4 pandas==2.2.2

      - name: Analyze results
        run: python experiments/analyze_rankq_v3.py

      - name: Commit analysis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiment_outputs/rankq_v3/ANALYSIS.md experiment_outputs/rankq_v3/analysis_*.csv
          git commit -m "Add computed RankQ v3 analysis [skip ci]" || true
          git push origin HEAD:agent/rankq-v3-progress-20260823
